<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Transcript Alignment Test</title>
    <style>
body {
    font-family: sans-serif;
    max-width: 700px;
    margin: 2rem auto;
    line-height: 1.8;
}
.paragraph {
    padding: 0.5rem;
    margin-bottom: 0.5rem;
    border-radius: 4px;
    border-radius: 10px;
}
.paragraph.current {
    background: rgba(255, 255, 0, 0.199);
}
.word {
    cursor: pointer;
}
.word:hover {
    text-decoration: underline;
}
.word.current {
    color: red;
}
audio {
    width: 100%;
    margin-bottom: 1rem;
}
    </style>
</head>

<body>
    <audio id="player" controls></audio>
    <div id="text"></div>

    <script type="module">

import { audioLink, sttTranscript, paragraphs, alignTranscriptToParagraphs } from './transcript.js';

const transcript = alignTranscriptToParagraphs(sttTranscript, paragraphs);
console.log(paragraphs);
console.log('Aligned transcript:', transcript);

const player = document.getElementById('player');
player.src = audioLink;

const textEl = document.getElementById('text');

// Preserve punctuation and whitespace while keeping word spans aligned with boundaries[].
const tokenize = (str) => (str.match(/[A-Za-z0-9']+|[^A-Za-z0-9']+/g) || []);

const paragraphEls = transcript.map((p) => {
    const pEl = document.createElement('p');
    pEl.className = 'paragraph';
    if (p.verseNumber) {
        const verseEl = document.createElement('span');
        verseEl.className = 'verse-number';
        verseEl.textContent = p.verseNumber + ' ';
        pEl.appendChild(verseEl);
    }
    tokenize(p.text).forEach((token) => {
        if (/^[A-Za-z0-9']+$/.test(token)) {
            const span = document.createElement('span');
            span.className = 'word';
            span.textContent = token;
            span.addEventListener('click', () => {
                const wordIdx = Array.from(pEl.querySelectorAll('.word')).indexOf(span);
                player.currentTime = wordIdx === 0 ? p.start : p.boundaries[wordIdx-1];
                player.play();
            });
            pEl.appendChild(span);
        } else {
            pEl.appendChild(document.createTextNode(token));
        }
    });
    textEl.appendChild(pEl);
    return pEl;
});

player.addEventListener('timeupdate', () => {
    const t = player.currentTime;

    transcript.forEach((p, pIdx) => {
        const isCurrent = t >= p.start && t < p.end;
        paragraphEls[pIdx].classList.toggle('current', isCurrent);

        const wordSpans = paragraphEls[pIdx].querySelectorAll('.word');
        if (!isCurrent) {
            wordSpans.forEach((w) => w.classList.remove('current'));
            return;
        }

        // Word index = how many boundary timestamps have already passed
        const wordIdx = p.boundaries.filter((b) => b <= t).length;
        wordSpans.forEach((w, i) => w.classList.toggle('current', i === wordIdx));
    });
});
    </script>
</body>

</html>
